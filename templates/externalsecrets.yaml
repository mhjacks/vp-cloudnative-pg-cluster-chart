{{- if .Values.secrets.enabled }}
{{- $names := dict }}
{{- with (((.Values.cluster).cluster).initdb).secret }}
{{- with .name }}
{{- $_ := set $names . true }}
{{- end }}
{{- end }}
{{- range (((.Values.cluster).cluster).roles | default list) }}
{{- with .passwordSecret }}
{{- with .name }}
{{- $_ := set $names . true }}
{{- end }}
{{- end }}
{{- end }}
{{- range (.Values.secrets.additional | default list) }}
{{- $_ := set $names . true }}
{{- end }}
{{- range $secretName := keys $names | sortAlpha }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.secrets.syncWave | quote }}
spec:
  refreshInterval: {{ $.Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secretStore.name }}
    kind: {{ $.Values.secretStore.kind }}
  target:
    name: {{ $secretName }}
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $.Values.secrets.keyPrefix $secretName }}
{{- end }}
{{- end }}
