# Example pattern values-secret entries for Automation Orchestrator.
# Place these under secrets: in the pattern's values-secret.yaml.template
# (or ~/values-secret-<pattern>.yaml). Do not commit real passwords.
#
# Projected by this chart's ExternalSecrets when keyPrefix is secret/data/hub.
# temporal and temporal_visibility share the temporal role; set the same
# password value on both secrets if you do not want independent generated passwords.

version: "2.0"

secrets:
  - name: orchestrator-postgres-secret
    vaultPrefixes:
      - hub
    fields:
      - name: username
        value: orchestrator
      - name: password
        onMissingValue: generate
        vaultPolicy: validatedPatternDefaultPolicy
      - name: database
        value: orchestrator
  - name: temporal-postgres-secret
    vaultPrefixes:
      - hub
    fields:
      - name: username
        value: temporal
      - name: password
        onMissingValue: generate
        vaultPolicy: validatedPatternDefaultPolicy
      - name: database
        value: temporal
  - name: temporal-visibility-postgres-secret
    vaultPrefixes:
      - hub
    fields:
      - name: username
        value: temporal
      - name: password
        onMissingValue: generate
        vaultPolicy: validatedPatternDefaultPolicy
      - name: database
        value: temporal_visibility
