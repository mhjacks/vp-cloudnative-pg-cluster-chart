suite: external secrets
templates:
  - templates/externalsecrets.yaml
tests:
  - it: projects the initdb secret
    set:
      cluster:
        cluster:
          initdb:
            secret:
              name: app-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: app-secret
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: app-secret
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/basic-auth
      - equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/app-secret

  - it: projects role and additional secrets without duplicates
    set:
      secrets:
        additional:
          - temporal-visibility-postgres-secret
          - temporal-postgres-secret
      cluster:
        cluster:
          initdb:
            secret:
              name: orchestrator-postgres-secret
          roles:
            - name: temporal
              passwordSecret:
                name: temporal-postgres-secret
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: metadata.name
          value: orchestrator-postgres-secret
      - documentIndex: 1
        equal:
          path: metadata.name
          value: temporal-postgres-secret
      - documentIndex: 2
        equal:
          path: metadata.name
          value: temporal-visibility-postgres-secret

  - it: renders nothing when secrets are disabled
    set:
      secrets:
        enabled: false
      cluster:
        cluster:
          initdb:
            secret:
              name: app-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when no secret names are configured
    asserts:
      - hasDocuments:
          count: 0
